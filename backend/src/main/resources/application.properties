# Application configuration
spring.application.name=seasonal-seiyuu

# Server configuration
server.port=8080
server.servlet.context-path=/seiyuu
server.forward-headers-strategy=framework

# Admin API Key (set via environment variable in production)
admin.api-key=${ADMIN_API_KEY:changeme}

# Cache directory
cache.directory=data

# Jikan API configuration
jikan.base-url=https://api.jikan.moe/v4
jikan.rate-limit-ms=1000
jikan.connect-timeout-ms=10000
jikan.read-timeout-ms=30000

# Automatic refresh is intentionally disabled by default. Enable it in the
# production service environment after validating one manual refresh.
refresh.enabled=${REFRESH_ENABLED:false}
refresh.daily-cron=${REFRESH_DAILY_CRON:0 0 3 * * *}
refresh.zone=${REFRESH_ZONE:UTC}
refresh.startup-delay=${REFRESH_STARTUP_DELAY:15s}
refresh.freshness-threshold=${REFRESH_FRESHNESS_THRESHOLD:24h}
refresh.retry-max-attempts=${REFRESH_RETRY_MAX_ATTEMPTS:5}
refresh.retry-initial-backoff=${REFRESH_RETRY_INITIAL_BACKOFF:1s}
refresh.retry-max-backoff=${REFRESH_RETRY_MAX_BACKOFF:30s}
refresh.retry-jitter=${REFRESH_RETRY_JITTER:250ms}
